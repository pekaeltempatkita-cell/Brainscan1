<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - NeuroCheck</title>
  <link rel="stylesheet" href="index.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="container" style="padding-top:24px; padding-bottom:32px;">
    <div id="errorBox"></div>

    <div class="card">
      <h2>Daftarkan Pasien Baru</h2>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group"><label>NIK</label><input type="text" name="nik" required placeholder="Masukkan NIK"></div>
          <div class="form-group"><label>Nama</label><input type="text" name="nama" required placeholder="Nama lengkap"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Tanggal Lahir</label><input type="date" name="tanggal_lahir" required></div>
          <div class="form-group"><label>Jenis Kelamin</label>
            <select name="jenis_kelamin" required>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Alamat</label><input type="text" name="alamat" placeholder="Alamat rumah"></div>
          <div class="form-group"><label>No. Telepon</label><input type="text" name="no_telepon" placeholder="Contoh: 08123456789"></div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top:8px;">Daftarkan Pasien</button>
      </form>
    </div>

    <div class="card">
      <h2>Cari Pasien Terdaftar</h2>
      <div class="form-row" style="margin-bottom:16px; align-items:end;">
        <div class="form-group">
          <label>Cari berdasarkan NIK atau Nama</label>
          <input type="text" id="searchBox" placeholder="Contoh: Markus atau 1234567890">
        </div>
      </div>
      <div class="table-responsive">
        <table class="styled">
          <thead><tr><th>NIK</th><th>Nama</th><th>Tgl Lahir</th><th>Aksi</th></tr></thead>
          <tbody id="patientsBody">
            <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="footer">&copy; 2026 NeuroCheck. All rights reserved.</div>

  <script>
    let allPatients = [];

    function renderPatients(list) {
      const body = document.getElementById("patientsBody");
      if (!list.length) {
        body.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Belum ada pasien terdaftar.</td></tr>';
        return;
      }
      body.innerHTML = list.map(p => `
        <tr>
          <td>${p.nik}</td><td>${p.nama}</td><td>${p.tanggal_lahir || "-"}</td>
          <td><a href="patient.html?nik=${encodeURIComponent(p.nik)}" class="btn btn-outline btn-sm">Lihat / Upload Scan</a></td>
        </tr>`).join("");
    }

    async function loadPatients() {
      try {
        const data = await NeuroCheckAPI.listPatients();
        allPatients = data.patients || [];
        renderPatients(allPatients);
      } catch (err) {
        document.getElementById("errorBox").innerHTML =
          `<div class="alert-error">Gagal memuat data pasien: ${err.message}</div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      if (!NeuroCheckAuth.requireLogin()) return;
      NeuroCheckAuth.renderNav();
      loadPatients();

      document.getElementById("searchBox").addEventListener("input", (e) => {
        const q = e.target.value.trim().toLowerCase();
        if (!q) { renderPatients(allPatients); return; }
        renderPatients(allPatients.filter(p =>
          p.nik.toLowerCase().includes(q) || p.nama.toLowerCase().includes(q)));
      });

      document.getElementById("registerForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const payload = Object.fromEntries(fd.entries());
        try {
          const res = await NeuroCheckAPI.createPatient(payload);
          window.location.href = `patient.html?nik=${encodeURIComponent(res.nik)}`;
        } catch (err) {
          document.getElementById("errorBox").innerHTML =
            `<div class="alert-error">${err.message}</div>`;
        }
      });
    });
  </script>
</body>
</html>
