<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - NeuroCheck</title>
  <link rel="stylesheet" href="index.css">
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="container" style="padding-top:24px; padding-bottom:32px;">
    <div id="errorBox"></div>
    <div class="card">
      <h2>Ringkasan Admin</h2>
      <p style="color:var(--text-muted); margin:0;">Total pasien terdaftar: <strong id="totalPatients">-</strong> | Total pemeriksaan: <strong id="totalRecords">-</strong></p>
    </div>
    <div class="card">
      <h2>History Pemeriksaan Semua Pasien</h2>
      <div class="table-responsive">
        <table class="styled">
          <thead><tr><th>Tanggal</th><th>NIK</th><th>Nama Pasien</th><th>Hasil</th><th>Confidence</th><th>Laporan</th></tr></thead>
          <tbody id="recordsBody"><tr><td colspan="6" style="text-align:center; color:var(--text-muted);">Memuat...</td></tr></tbody>
        </table>
      </div>
    </div>
    <div class="card">
      <h2>Semua Pasien Terdaftar</h2>
      <div class="table-responsive">
        <table class="styled">
          <thead><tr><th>NIK</th><th>Nama</th><th>Tgl Lahir</th><th>Didaftarkan Oleh</th></tr></thead>
          <tbody id="patientsBody"><tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Memuat...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
  <div class="footer">&copy; 2026 NeuroCheck. All rights reserved.</div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!NeuroCheckAuth.requireAdmin()) return;
      NeuroCheckAuth.renderNav();

      try {
        const data = await NeuroCheckAPI.adminOverview();
        const records = data.records || [];
        const patients = data.patients || [];

        document.getElementById("totalPatients").textContent = patients.length;
        document.getElementById("totalRecords").textContent = records.length;

        document.getElementById("recordsBody").innerHTML = records.length ? records.map(r => `
          <tr>
            <td>${r.created_at || "-"}</td><td>${r.nik}</td><td>${r.nama_pasien || "-"}</td>
            <td>${r.prediction_label || "-"}</td>
            <td>${r.prediction_confidence ? (r.prediction_confidence * 100).toFixed(1) + "%" : "-"}</td>
            <td>${r.prediction_id ? `<a href="${NeuroCheckAPI.reportUrl(r.nik, r.prediction_id)}" target="_blank" class="btn btn-outline btn-sm">Unduh PDF</a>` : "-"}</td>
          </tr>`).join("") : '<tr><td colspan="6" style="text-align:center; color:var(--text-muted);">Belum ada data pemeriksaan.</td></tr>';

        document.getElementById("patientsBody").innerHTML = patients.length ? patients.map(p => `
          <tr><td>${p.nik}</td><td>${p.nama}</td><td>${p.tanggal_lahir || "-"}</td><td>${p.created_by_email || "-"}</td></tr>`).join("")
          : '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Belum ada pasien terdaftar.</td></tr>';
      } catch (err) {
        document.getElementById("errorBox").innerHTML = `<div class="alert-error">Gagal memuat data admin: ${err.message}</div>`;
      }
    });
  </script>
</body>
</html>
